[project]
name = "kebos-backend"
version = "1.0.0"
description = "Kebos AI Backend - Post-Quantum Native Cyber Threat Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.23",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.0",
    "redis==5.0.1",
    "hvac==2.1.0",
    "python-jose[cryptography]==3.3.0",
    "PyJWT==2.8.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.6",
    "pyotp==2.9.0",
    "aiokafka==0.9.0",
    "lz4==4.3.2",
    "celery==5.3.4",
    "httpx==0.25.2",
    "slowapi==0.1.9",
    "python-dotenv==1.0.0",
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "cryptography==41.0.7",
    "docker==6.1.3",
    "stix2==3.0.1",
    "scipy==1.11.4",
    "pyyaml==6.0.1",
    "aiofiles==23.2.1",
    "numpy>=1.26.0",
    "webauthn>=2.0.0",
    "geoip2>=4.6.0",
    "maxminddb>=2.4.0",
    "catboost>=1.2.2",
    "reportlab>=4.0.0",
    "jinja2>=3.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
